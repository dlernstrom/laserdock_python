[project]
name = "laserdock-python"
version = "0.1.0"
description = "Image and pattern engraving with a USB LaserDock"
requires-python = ">=3.14"
dependencies = [
    "pillow>=13.0.0,<14",
    "pyusb>=1.3.1,<2",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0,<3",
    "pytest>=9.2.0,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.17.3,<0.18",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.mypy]
python_version = "3.14"
files = ["laserdock", "tests"]
strict = true

[[tool.mypy.overrides]]
module = ["usb", "usb.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["laserdock"]
branch = true

[tool.coverage.report]
show_missing = true
